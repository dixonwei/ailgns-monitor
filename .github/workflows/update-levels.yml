name: update-levels

on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-levels
  cancel-in-progress: false

jobs:
  collect-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 扫描真实投入与推荐关系
        run: node collect-levels.mjs

      - name: 合并到站点数据
        run: node collect-chain.mjs

      - name: 提交 P 等级名单
        run: |
          git config user.name  "ailgns-level-bot"
          git config user.email "ailgns-level-bot@users.noreply.github.com"
          git add p-levels.json data.json
          if git diff --quiet --cached; then
            echo "没有变化，跳过提交"
          else
            git commit -m "levels: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
