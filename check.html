<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiLGNS 领取查询</title>
<style>
 :root{--bg:#0b0f16;--card:#121926;--line:#223045;--ink:#e9eef7;--dim:#8ea2bd;--gold:#e3b23c;--green:#38c172}
 *{box-sizing:border-box}
 body{margin:0;background:radial-gradient(1100px 500px at 50% -12%,#16233a,#0b0f16 62%);color:var(--ink);
      font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:22px 16px 40px}
 .wrap{max-width:760px;margin:0 auto}
 h1{font-size:20px;margin:4px 0 4px}
 .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
 .row{display:flex;gap:8px}
 input{flex:1;min-width:0;background:#0f1724;border:1px solid var(--line);color:var(--ink);border-radius:11px;
       padding:12px 14px;font-size:14.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 input:focus{outline:none;border-color:var(--gold)}
 button{background:var(--gold);color:#1a1405;border:0;border-radius:11px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer}
 button:disabled{opacity:.55}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
 .card.all{border-color:rgba(227,178,60,.55);background:rgba(227,178,60,.08)}
 .k{color:var(--dim);font-size:12.5px}
 .v{font-size:25px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
 .u{font-size:11.5px;color:var(--dim);margin-top:3px}
 h2{font-size:14.5px;margin:20px 0 4px;color:var(--gold)}
 table{width:100%;border-collapse:collapse;font-size:13.5px}
 th,td{padding:6px 6px;border-bottom:1px solid var(--line)}
 th{color:var(--dim);font-weight:600;font-size:12.5px;text-align:left}
 td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
 .note{color:var(--dim);font-size:12.5px;margin-top:12px}
 .err{color:#ff7b72}
 .tag{display:inline-block;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
 @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AiLGNS 领取查询</h1>
  <div class="sub">输入钱包地址，直接读 Anubis 链上领取记录 —— 不连钱包、不发起交易、任何地址都能查。</div>
  <div class="row">
    <input id="addr" placeholder="粘贴钱包地址 0x…" spellcheck="false" autocomplete="off" inputmode="text">
    <button id="go">查询</button>
  </div>
  <div id="out"></div>
  <p class="note">
    个人＝算力每天兑付累计　社区＝动态奖励（团队奖）累计　一共＝两者相加<br>
    数据来源：Anubis 链上「领取」交易（最多回溯 40 天 / 1500 笔），金额取自链上事件，可与区块浏览器逐笔核对。
  </p>
</div>
<script>
var API = 'https://browser.anubispace.org/api';
var POOL = '0x3deea5f638ca0dfb03a0873cf4c0b90ba50e1aa2';
var POWER = '0x9e68f61e2615cc1d2c4a2d0026bfc1ebfdf68c1b';
var TRANSFER = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
var MAX_PAGE = 15, DAYS = 40, CONC = 6;
var $ = function(id){ return document.getElementById(id); };
function fmt(n, d){ if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function addrOf(l){ var a = (l && l.address) || ''; if (a && a.hash) a = a.hash; return String(a).toLowerCase(); }
function topic0(l){ return String((l.topics || [])[0] || '').toLowerCase(); }

function txlist(a, page){
  var u = API + '?module=account&action=txlist&address=' + a + '&page=' + page + '&offset=100&sort=desc';
  return fetch(u, { cache: 'no-store' }).then(function(r){ return r.json(); })
    .then(function(j){ return (j && j.result) || []; });
}
function txlogs(h){
  return fetch('https://browser.anubispace.org/api/v2/transactions/' + h + '/logs', { cache: 'no-store' })
    .then(function(r){ return r.json(); }).then(function(j){ return (j && j.items) || []; }).catch(function(){ return []; });
}
function poolAmount(ls){
  var v = 0;
  ls.forEach(function(l){
    if (topic0(l) !== TRANSFER) return;
    var tp = l.topics || [];
    var from = '0x' + String(tp[1] || '').slice(26).toLowerCase();
    if (from !== POOL) return;
    try { var n = Number(BigInt(l.data)) / 1e18; if (n > v) v = n; } catch (e) {}
  });
  return v;
}
function dateKey(ts){ var d = new Date(Number(ts) * 1000);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function chainLookup(a, onStep){
  var rows = [], page = 1, capped = false;
  function nextPage(){
    if (page > MAX_PAGE) { capped = true; return process(); }
    onStep && onStep('读取交易记录… 第 ' + page + ' 页');
    return txlist(a, page).then(function(items){
      if (!items.length) return process();
      rows = rows.concat(items);
      var last = items[items.length - 1];
      var oldest = Number(last.timeStamp) * 1000;
      page++;
      if (Date.now() - oldest > DAYS * 86400000) return process();
      return nextPage();
    }).catch(function(){ return process(); });
  }
  function process(){
    var cand = rows.filter(function(x){ return String(x.to || '').toLowerCase() === POOL; });
    var mine = [], comm = [], unknown = 0;
    var i = 0;
    function step(){
      if (i >= cand.length) return done();
      var part = cand.slice(i, i + CONC); i += CONC;
      onStep && onStep('读取领取明细… ' + i + ' / ' + cand.length);
      return Promise.all(part.map(function(x){ return txlogs(x.hash); })).then(function(lls){
        part.forEach(function(x, k){
          var ls = lls[k] || [], v = poolAmount(ls);
          if (!v) { unknown++; return; }
          var item = { d: dateKey(x.timeStamp), v: v, hash: x.hash, ts: Number(x.timeStamp) };
          var isMine = x.methodId === '0x064f3406' || ls.some(function(l){ return addrOf(l) === POWER; });
          if (isMine) mine.push(item); else comm.push(item);
        });
        return step();
      });
    }
    function done(){
      var sum = function(arr){ return arr.reduce(function(a, b){ return a + b.v; }, 0); };
      mine.sort(function(a, b){ return b.ts - a.ts; });
      comm.sort(function(a, b){ return b.ts - a.ts; });
      onStep(null, { payCum: sum(mine), rwCum: sum(comm), payHist: mine, rwHist: comm,
                     payTimes: mine.length, rwTimes: comm.length, capped: capped, txs: rows.length });
    }
    return step();
  }
  return nextPage();
}

function render(a, m, src){
  var pay = m.payCum == null ? null : m.payCum;
  var rw  = m.rwCum  == null ? null : m.rwCum;
  var h = '<div class="grid">' +
    '<div class="card"><div class="k">个人（算力兑付）</div><div class="v" style="color:var(--green)">' + fmt(pay, 4) +
      '</div><div class="u">AiLGNS' + (m.payTimes ? ' · ' + m.payTimes + ' 次' : '') +
      (m.payCumDAI ? ' · 约 ' + fmt(m.payCumDAI, 2) + ' DAI' : '') + '</div></div>' +
    '<div class="card"><div class="k">社区（动态奖励）</div><div class="v" style="color:var(--gold)">' + fmt(rw, 4) +
      '</div><div class="u">AiLGNS' + (m.rwTimes ? ' · ' + m.rwTimes + ' 次' : '') + '</div></div>' +
    '<div class="card all"><div class="k">一共</div><div class="v">' + fmt((pay || 0) + (rw || 0), 4) +
      '</div><div class="u">AiLGNS</div></div></div>';

  if (m.payHist && m.payHist.length){
    h += '<h2>历史释放 · 个人算力兑付</h2><table><tr><th>领取时间</th><th class="n">AiLGNS</th></tr>';
    m.payHist.forEach(function(x){ h += '<tr><td>' + x.d + '</td><td class="n">' + fmt(x.v, 4) + '</td></tr>'; });
    h += '</table>';
  }
  if (m.rwHist && m.rwHist.length){
    h += '<h2>历史释放 · 社区动态奖励</h2><table><tr><th>领取时间</th><th class="n">AiLGNS</th></tr>';
    m.rwHist.forEach(function(x){ h += '<tr><td>' + x.d + '</td><td class="n">' + fmt(x.v, 4) + '</td></tr>'; });
    h += '</table>';
  }
  if (!m.payHist.length && !m.rwHist.length) h += '<p class="note">这个地址没有任何领取记录（可能还没存过 DAI、或还没上 P 等级）。</p>';
  if (m.capped) h += '<p class="note">提示：交易太多，只统计了最近的部分交易，数字可能偏小。</p>';
  h += '<p class="note" style="word-break:break-all">' + a + (src ? '<span class="tag">' + src + '</span>' : '') + '</p>';
  $('out').innerHTML = h;
}

function query(){
  var raw = ($('addr').value || '').trim();
  var out = $('out');
  if (!/^0x[0-9a-fA-F]{40}$/.test(raw)) { out.innerHTML = '<p class="err" style="margin-top:14px">请填完整地址（0x 开头，42 位）</p>'; return; }
  var a = raw.toLowerCase();
  $('go').disabled = true;
  out.innerHTML = '<p class="note">查询中…（直接读链上领取记录，大约几秒）</p>';
  chainLookup(a, function(step, res){
    if (step) { out.innerHTML = '<p class="note">' + step + '</p>'; return; }
    $('go').disabled = false;
    if (!res) { out.innerHTML = '<p class="err">读取失败，请稍后重试。</p>'; return; }
    render(a, res, '链上领取记录');
  }).catch(function(e){
    $('go').disabled = false;
    out.innerHTML = '<p class="err">查询失败：' + e.message + '</p>';
  });
}
$('go').addEventListener('click', query);
$('addr').addEventListener('keydown', function(e){ if (e.key === 'Enter') query(); });
</script>
</body>
</html>
