<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiLGNS 领取查询</title>
<style>
 :root{--bg:#0b0f16;--card:#121926;--line:#223045;--ink:#e9eef7;--dim:#8ea2bd;--gold:#e3b23c;--green:#38c172}
 *{box-sizing:border-box}
 body{margin:0;background:radial-gradient(1100px 500px at 50% -12%,#16233a,#0b0f16 62%);color:var(--ink);
      font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:22px 16px 40px}
 .wrap{max-width:700px;margin:0 auto}
 h1{font-size:20px;margin:4px 0 16px}
 .row{display:flex;gap:8px}
 input{flex:1;min-width:0;background:#0f1724;border:1px solid var(--line);color:var(--ink);border-radius:11px;
       padding:12px 14px;font-size:14.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 input:focus{outline:none;border-color:var(--gold)}
 button{background:var(--gold);color:#1a1405;border:0;border-radius:11px;padding:12px 22px;font-size:15px;
        font-weight:800;cursor:pointer;white-space:nowrap}
 button:disabled{opacity:.55}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
 .card.all{border-color:rgba(227,178,60,.55);background:rgba(227,178,60,.08)}
 .k{color:var(--dim);font-size:12.5px}
 .v{font-size:25px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
 .u{font-size:11.5px;color:var(--dim);margin-top:3px}
 h2{font-size:14.5px;margin:20px 0 4px;color:var(--gold)}
 table{width:100%;border-collapse:collapse;font-size:13.5px}
 th,td{padding:7px 6px;border-bottom:1px solid var(--line)}
 th{color:var(--dim);font-weight:600;font-size:12.5px;text-align:left}
 td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
 .note{color:var(--dim);font-size:12.5px;margin-top:14px}
 .err{color:#ff7b72}
 .tag{display:inline-block;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
 @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AiLGNS 领取查询</h1>
  <div class="row">
    <input id="addr" placeholder="粘贴钱包地址 0x…（只读查询，不连钱包、不发起交易）" spellcheck="false" autocomplete="off">
    <button id="go">查询</button>
  </div>
  <div id="out"></div>
  <p class="note">
    <b>个人</b>＝算力每天兑付累计　<b>社区</b>＝官方动态奖励（团队奖）累计　<b>合计</b>＝两者相加<br>
    线上版覆盖 <b>watchlist.txt</b> 里已加入的地址（每 30 分钟更新）；在你自己电脑上打开（localhost）可查任意地址。
  </p>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function fmt(n, d){ if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d }); }

function render(a, m, src){
  var pay = (m.payCum === null || m.payCum === undefined) ? null : m.payCum;
  var rw  = (m.rwCum  === null || m.rwCum  === undefined) ? null : m.rwCum;
  var all = (pay || 0) + (rw || 0);
  var h = '<div class="grid">' +
    '<div class="card"><div class="k">个人（算力兑付）</div><div class="v" style="color:var(--green)">' + fmt(pay, 4) +
      '</div><div class="u">AiLGNS' + (m.days ? ' · ' + m.days + ' 天' : '') + (m.payClaimed != null ? ' · 已领 ' + fmt(m.payClaimed, 4) : '') + '</div></div>' +
    '<div class="card"><div class="k">社区（动态奖励）</div><div class="v" style="color:var(--gold)">' + fmt(rw, 4) +
      '</div><div class="u">AiLGNS' + (m.rwOnchain != null ? ' · 链上已记入 ' + fmt(m.rwOnchain, 4) : '') + '</div></div>' +
    '<div class="card all"><div class="k">一共</div><div class="v">' + fmt(all, 4) + '</div><div class="u">AiLGNS</div></div>' +
    '</div>';

  if (m.payHist && m.payHist.length){
    h += '<h2>历史释放 · 个人算力兑付</h2><table><tr><th>日期</th><th class="n">AiLGNS</th><th class="n">约 DAI</th><th class="n">算力</th></tr>';
    m.payHist.forEach(function(x){ h += '<tr><td>' + x.d + '</td><td class="n">' + fmt(x.v, 4) + '</td><td class="n">' + fmt(x.dai, 2) + '</td><td class="n">' + fmt(x.power, 0) + '</td></tr>'; });
    h += '</table>';
  }
  if (m.rwHist && m.rwHist.length){
    h += '<h2>历史释放 · 社区动态奖励</h2><table><tr><th>日期</th><th class="n">AiLGNS</th><th>等级</th></tr>';
    m.rwHist.forEach(function(x){ h += '<tr><td>' + x.d + '</td><td class="n">' + fmt(x.v, 4) + '</td><td>' + x.lv + '</td></tr>'; });
    h += '</table>';
  }
  if (m.rwCum != null && m.rwGrowth != null){
    h += '<p class="note">社区累计构成：增长 ' + fmt(m.rwGrowth, 4) + ' ＋ 网络 ' + fmt(m.rwNetwork, 4) + ' ＋ 共识 ' + fmt(m.rwConsensus, 4) + ' = ' + fmt(m.rwCum, 4) + ' AiLGNS</p>';
  }
  h += '<p class="note" style="word-break:break-all">' + a + (src ? '<span class="tag">' + src + '</span>' : '') + '</p>';
  $('out').innerHTML = h;
}

function query(){
  var raw = ($('addr').value || '').trim();
  var out = $('out');
  if (!/^0x[0-9a-fA-F]{40}$/.test(raw)) { out.innerHTML = '<p class="err" style="margin-top:14px">请填完整地址（0x 开头，42 位）</p>'; return; }
  var a = raw.toLowerCase();
  $('go').disabled = true;
  out.innerHTML = '<p class="note">查询中…</p>';

  function done(m, src){
    $('go').disabled = false;
    if (!m) {
      out.innerHTML = '<p class="err" style="margin-top:14px">查不到这个地址的数据。</p>' +
        '<p class="note">线上版只覆盖 watchlist.txt 里已加入的地址：把地址一行一个加进去、提交，等下一次自动更新（每 30 分钟）后再查。<br>' +
        '在你自己电脑上运行 <b>node server.mjs</b> 打开本地版，可以实时查任意地址。</p>';
      return;
    }
    render(a, m, src);
  }

  // 1) 本地服务：可实时查任意地址
  fetch('api/addr?addr=' + a, { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.ok && j.mine) { done(j.mine, '实时'); return; }
      // 2) 线上：data.json 里关注钱包的数据
      return fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          var w = (d && d.watch && d.watch[a]) || null;
          done(w && w.mine ? w.mine : null, '每 30 分钟更新');
        })
        .catch(function(){ done(null); });
    })
    .catch(function(){
      fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(d){ var w = (d && d.watch && d.watch[a]) || null; done(w && w.mine ? w.mine : null, '每 30 分钟更新'); })
        .catch(function(){ done(null); });
    });
}
$('go').addEventListener('click', query);
$('addr').addEventListener('keydown', function(e){ if (e.key === 'Enter') query(); });
</script>
</body>
</html>
